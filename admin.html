<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOTTA SHOP | Painel Administrativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0D0D0D;
      --card-bg: #161618;
      --primary: #FF5500;
      --primary-hover: #E04B00;
      --text-main: #FFFFFF;
      --text-muted: #A0A0AA;
      --border: #2A2A30;
      --accent-gray: #222226;
      --danger: #FF3333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    #login-overlay { position: fixed; inset: 0; background: var(--bg-color); z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .login-box { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; }
    .login-box h2 { font-family: 'Orbitron', sans-serif; margin-bottom: 20px; font-size: 1.5rem; }
    
    header { background: rgba(13, 13, 13, 0.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand-logo svg { height: 48px; width: auto; }
    
    .main-container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; flex: 1; width: 100%; display: grid; grid-template-columns: 400px 1fr; gap: 40px; }
    @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }

    .form-card { background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 12px; height: fit-content; }
    .form-card h3 { font-family: 'Orbitron', sans-serif; margin-bottom: 20px; font-size: 1.2rem; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
    .input-group input, .input-group textarea, .input-group select { width: 100%; background: var(--bg-color); border: 1px solid var(--border); padding: 10px 14px; border-radius: 6px; color: var(--text-main); font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: var(--primary); }
    .input-group textarea { resize: vertical; min-height: 80px; }
    
    .btn { background: var(--accent-gray); color: var(--text-main); border: 1px solid var(--border); padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 0.9rem; width: 100%; }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); color: #FFF; border: none; }
    .btn-primary:hover { background: var(--primary-hover); color: #FFF; }
    .btn-danger { background: rgba(255, 51, 51, 0.1); color: var(--danger); border-color: rgba(255, 51, 51, 0.3); }
    .btn-danger:hover { background: var(--danger); color: #FFF; }

    .admin-list h3 { font-family: 'Orbitron', sans-serif; margin-bottom: 20px; font-size: 1.2rem; }
    .products-table { display: flex; flex-direction: column; gap: 12px; }
    .product-row { background: var(--card-bg); border: 1px solid var(--border); padding: 14px; border-radius: 8px; display: flex; align-items: center; gap: 16px; }
    .product-row img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; background: #000; }
    .product-row-info { flex: 1; }
    .product-row-title { font-weight: 700; font-size: 1rem; font-family: 'Rajdhani', sans-serif; }
    .product-row-cat { background: var(--accent-gray); color: var(--text-muted); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; display: inline-block; margin-top: 4px; }
    
    footer { text-align: center; padding: 25px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Área Restrita</h2>
      <div class="input-group">
        <input type="password" id="admin-pass" placeholder="Palavra-passe admin">
      </div>
      <button class="btn btn-primary" id="btn-login">Entrar</button>
    </div>
  </div>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <svg viewBox="0 0 620 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF7700"/><stop offset="100%" stop-color="#FF3300"/></linearGradient>
            <linearGradient id="cyberWhite" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#D0D0D5"/></linearGradient>
          </defs>
          <g transform="translate(10, 10)">
            <path d="M 15 155 L 55 155 L 55 85 L 105 130 L 125 130 L 75 70 L 75 15 L 15 15 Z" fill="url(#cyberWhite)"/>
            <path d="M 165 155 L 125 155 L 125 85 L 75 130 L 55 130 L 105 70 L 105 15 L 165 15 Z" fill="url(#cyberWhite)"/>
            <path d="M 140 155 L 175 155 L 175 60 L 140 95 Z" fill="url(#neonOrange)"/>
            <circle cx="157" cy="40" r="8" fill="#FF5500"/>
            <line x1="157" y1="48" x2="157" y2="60" stroke="#FF5500" stroke-width="3"/>
          </g>
          <path d="M 195 25 L 205 15 L 600 15 L 600 35" stroke="#33333C" stroke-width="2" fill="none"/>
          <path d="M 195 145 L 205 155 L 600 155 L 600 135" stroke="#33333C" stroke-width="2" fill="none"/>
          <text x="200" y="105" font-family="'Orbitron', sans-serif" font-weight="900" font-size="78" fill="url(#cyberWhite)" letter-spacing="6">MOTTA</text>
          <rect x="500" y="45" width="105" height="42" rx="4" fill="#FF5500"/>
          <text x="512" y="75" font-family="'Orbitron', sans-serif" font-weight="900" font-size="24" fill="#0D0D0D" letter-spacing="3">SHOP</text>
          <text x="202" y="140" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="20" fill="#FF5500" letter-spacing="8">O SEU CONECTIVO DIGITAL</text>
          <line x1="200" y1="155" x2="520" y2="155" stroke="#FF5500" stroke-width="3"/>
          <circle cx="525" cy="155" r="3" fill="#FF5500"/>
        </svg>
      </a>
      <a href="index.html" class="btn" style="width: auto;">Ver Vitrine ↗</a>
    </div>
  </header>

  <main class="main-container">
    <div class="form-card">
      <h3>Cadastrar Produto</h3>
      <form id="product-form">
        <div class="input-group">
          <label>Título do Produto</label>
          <input type="text" id="p-title" required placeholder="Ex: Fone Bluetooth 760BT">
        </div>
        <div class="input-group">
          <label>Categoria</label>
          <input type="text" id="p-category" required placeholder="Ex: Áudio, Informática, Gamer..." list="suggested-cats">
          <datalist id="suggested-cats">
            <option value="Áudio">
            <option value="Informática">
            <option value="Automotivo">
            <option value="Gamer">
            <option value="Smartphones">
          </datalist>
        </div>
        <div class="input-group">
          <label>URL da Imagem</label>
          <input type="url" id="p-img" required placeholder="https://exemplo.com/imagem.jpg">
        </div>
        <div class="input-group">
          <label>Link de Afiliado / Oferta</label>
          <input type="url" id="p-mp" required placeholder="https://shope.ee/...">
        </div>
        <div class="input-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="margin-bottom:0;">Descrição</label>
            <button type="button" class="btn" id="btn-ai-summarize" style="padding: 2px 8px; font-size: 0.75rem; width: auto;">✨ Resumir com IA</button>
          </div>
          <textarea id="p-desc" placeholder="Cole a descrição longa do produto aqui..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Adicionar à Vitrine</button>
      </form>
    </div>

    <div class="admin-list">
      <h3>Produtos na Vitrine (<span id="prod-count">0</span>)</h3>
      <div class="products-table" id="admin-products-list">
        <p style="color:var(--text-muted);">A carregar produtos...</p>
      </div>
    </div>
  </main>

  <footer>&copy; 2026 MOTTA SHOP — Painel de Controlo</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgkU2EiRzjjAUUNxacblcOHOs3R2x1QdY",
      authDomain: "motta-shop.firebaseapp.com",
      projectId: "motta-shop",
      storageBucket: "motta-shop.firebasestorage.app",
      messagingSenderId: "1089173662496",
      appId: "1:1089173662496:web:4590dd2dad9799699ec545",
      measurementId: "G-7RC3JTFF77"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const prodsCol = collection(db, "produtos");

    const loginOverlay = document.getElementById('login-overlay');
    const adminPassInput = document.getElementById('admin-pass');
    const btnLogin = document.getElementById('btn-login');

    btnLogin.addEventListener('click', () => {
      if (adminPassInput.value === 'admin') {
        loginOverlay.style.display = 'none';
      } else {
        alert('Palavra-passe incorreta!');
      }
    });

    adminPassInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btnLogin.click();
    });

    const btnAiSummarize = document.getElementById('btn-ai-summarize');
    const descInput = document.getElementById('p-desc');

    btnAiSummarize.addEventListener('click', async () => {
      const originalText = descInput.value.trim();
      if (!originalText) {
        alert('Insira ou cole uma descrição longa primeiro!');
        return;
      }
      btnAiSummarize.innerText = 'A resumir...';
      btnAiSummarize.disabled = true;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyCgkU2EiRzjjAUUNxacblcOHOs3R2x1QdY`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Resuma esta descrição num texto comercial curto de até 2 frases para afiliado:\n\n${originalText}` }] }]
          })
        });
        const data = await response.json();
        const summary = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (summary) descInput.value = summary.json ? summary.trim() : summary.trim();
      } catch (err) {
        console.error(err);
      } finally {
        btnAiSummarize.innerText = '✨ Resumir com IA';
        btnAiSummarize.disabled = false;
      }
    });

    const form = document.getElementById('product-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(prodsCol, {
          title: document.getElementById('p-title').value,
          category: document.getElementById('p-category').value.trim() || 'Geral',
          img: document.getElementById('p-img').value,
          mp: document.getElementById('p-mp').value,
          desc: document.getElementById('p-desc').value,
          createdAt: Date.now()
        });
        form.reset();
        alert('Produto cadastrado com sucesso!');
      } catch (err) {
        console.error(err);
        alert('Erro ao cadastrar produto.');
      }
    });

    const adminList = document.getElementById('admin-products-list');
    const prodCount = document.getElementById('prod-count');

    onSnapshot(prodsCol, (snapshot) => {
      const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      prodCount.innerText = docs.length;
      
      if (docs.length === 0) {
        adminList.innerHTML = '<p style="color:var(--text-muted);">Nenhum produto cadastrado.</p>';
        return;
      }

      adminList.innerHTML = '';
      docs.forEach(p => {
        adminList.innerHTML += `
          <div class="product-row">
            <img src="${p.img}" onerror="this.src='https://via.placeholder.com/60?text=Erro'">
            <div class="product-row-info">
              <div class="product-row-title">${p.title}</div>
              <span class="product-row-cat">${p.category || 'Geral'}</span>
            </div>
            <button class="btn btn-danger" style="width: auto; padding: 6px 12px;" onclick="window.deleteProduct('${p.id}')">Excluir</button>
          </div>
        `;
      });
    });

    window.deleteProduct = async (id) => {
      if (confirm('Deseja excluir este produto?')) {
        await deleteDoc(doc(db, "produtos", id));
      }
    };
  </script>
</body>
</html>
