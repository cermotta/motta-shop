<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOTTA SHOP | Loja Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0D0D0D;
      --card-bg: #161618;
      --primary: #FF5500;
      --primary-hover: #E04B00;
      --text-main: #FFFFFF;
      --text-muted: #A0A0AA;
      --border: #2A2A30;
      --accent-gray: #222226;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: rgba(13, 13, 13, 0.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand-logo svg { height: 42px; width: auto; }
    .btn { background: var(--accent-gray); color: var(--text-main); border: 1px solid var(--border); padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 0.9rem; }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); color: #FFF; border: none; }
    .btn-primary:hover { background: var(--primary-hover); color: #FFF; }
    .hero { text-align: center; padding: 50px 20px 30px; background: radial-gradient(circle at center, rgba(255,85,0,0.12) 0%, rgba(13,13,13,0) 70%); }
    .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; }
    .hero p { color: var(--text-muted); margin-top: 8px; font-size: 1rem; }
    .main-container { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; flex: 1; width: 100%; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
    .product-card:hover { transform: translateY(-3px); border-color: var(--primary); }
    .product-img { width: 100%; height: 190px; object-fit: cover; background: #000; border-bottom: 1px solid var(--border); }
    .product-info { padding: 16px; display: flex; flex-direction: column; flex: 1; }
    .product-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; font-family: 'Rajdhani', sans-serif; }
    .product-desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.3; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price { font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-bottom: 14px; font-family: 'Orbitron', sans-serif; }
    footer { text-align: center; padding: 25px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <svg viewBox="0 0 500 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 20 185 L 70 185 L 70 115 L 120 160 L 170 115 L 170 185 L 220 185 L 220 40 L 170 40 L 120 85 L 70 40 L 20 40 Z" fill="#FFFFFF"/>
          <path d="M 190 185 L 240 185 L 240 85 L 190 125 Z" fill="#FF5500"/>
          <text x="250" y="145" font-family="'Orbitron', sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" letter-spacing="4">MOTTA</text>
          <line x1="20" y1="205" x2="150" y2="205" stroke="#FF5500" stroke-width="4"/>
          <text x="175" y="214" font-family="'Orbitron', sans-serif" font-weight="800" font-size="26" fill="#FF5500" letter-spacing="12">SHOP</text>
          <line x1="330" y1="205" x2="480" y2="205" stroke="#FF5500" stroke-width="4"/>
        </svg>
      </a>
    </div>
  </header>

  <section class="hero">
    <h1>Vitrine de Ofertas</h1>
    <p>Os melhores produtos selecionados para você</p>
  </section>

  <main class="main-container">
    <div class="products-grid" id="products-grid"></div>
  </main>

  <footer>&copy; 2026 MOTTA SHOP — Todos os direitos reservados.</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgkU2EiRzjjAUUNxacblcOHOs3R2x1QdY",
      authDomain: "motta-shop.firebaseapp.com",
      projectId: "motta-shop",
      storageBucket: "motta-shop.firebasestorage.app",
      messagingSenderId: "1089173662496",
      appId: "1:1089173662496:web:4590dd2dad9799699ec545",
      measurementId: "G-7RC3JTFF77"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const prodsCol = collection(db, "produtos");

    let products = [];
    const grid = document.getElementById('products-grid');

    onSnapshot(prodsCol, (snapshot) => {
      products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderProducts();
    });

    function renderProducts() {
      grid.innerHTML = products.length === 0 ? '<p style="color:var(--text-muted); grid-column:1/-1; text-align:center;">Nenhum produto cadastrado no momento.</p>' : '';
      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${p.img}" class="product-img" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300x200?text=Sem+Imagem'">
            <div class="product-info">
              <div class="product-title">${p.title}</div>
              <div class="product-desc" title="${p.desc || ''}">${p.desc || ''}</div>
              <div class="product-price">R$ ${parseFloat(p.price).toFixed(2).replace('.', ',')}</div>
              <a href="${p.mp}" target="_blank" class="btn btn-primary" style="width:100%; justify-content:center;">Ver Oferta</a>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
